name: Deploy Signaling Server (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-signaling.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/172481127144/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@ksl-project-26772112.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ksl-signaling \
            --source ./server \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --timeout 3600 \
            --min-instances 1 \
            --max-instances 1
